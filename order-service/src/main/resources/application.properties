spring.application.name=order-service
server.port=8082
spring.jackson.default-property-inclusion=non_null

spring.config.import=optional:configserver:http://localhost:8888

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10

app.environment=LOCAL

user-service.base-url=http://USER-SERVICE
user-service.connect-timeout-ms=2000
user-service.read-timeout-ms=2000

payment-service.base-url=http://PAYMENT-SERVICE
payment-service.connect-timeout-ms=2000
payment-service.read-timeout-ms=2000

resilience4j.retry.instances.paymentService.max-attempts=3
resilience4j.retry.instances.paymentService.wait-duration=300ms
resilience4j.retry.instances.paymentService.retry-exceptions=com.oneenterprise.orderservice.exception.PaymentUnavailableException

resilience4j.circuitbreaker.instances.paymentService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=6
resilience4j.circuitbreaker.instances.paymentService.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.paymentService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.paymentService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.paymentService.record-exceptions=com.oneenterprise.orderservice.exception.PaymentUnavailableException

management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents,retryevents
management.health.circuitbreakers.enabled=true
