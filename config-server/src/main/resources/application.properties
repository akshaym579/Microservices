spring.application.name=config-server
server.port=8888

spring.profiles.active=native
spring.cloud.config.server.native.search-locations=${CONFIG_REPO:file:///C:/Project/microservices/config-repo}

# The native (filesystem) backend keeps config-repo inside this project so the whole
# system can be cloned and run. To use a Git-backed repository instead, drop the two
# lines above and set:
#   spring.cloud.config.server.git.uri=file:///C:/Project/config-repo
# Override the location without rebuilding:
#   java -jar config-server.jar --CONFIG_REPO=file:///some/other/path
